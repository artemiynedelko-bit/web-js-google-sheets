<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая работа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Практическая работа</h1>

    <p id="message">Это учебная веб-страница, созданная с использованием HTML и JavaScript.</p>

    <img src="images/image.svg" alt="Иллюстрация для веб-страницы">

    <br>

    <button id="actionButton">Нажать кнопку</button>

    <h2>Данные из Google Таблицы</h2>

    <p id="loading">Загрузка данных...</p>
    <p id="error"></p>

    <table id="dataTable" hidden>
        <thead>
            <tr>
                <th>Название</th>
                <th>Автор</th>
                <th>Год</th>
            </tr>
        </thead>
        <tbody id="dataBody"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
